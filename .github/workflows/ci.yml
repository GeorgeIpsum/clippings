name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: git config --global init.defaultBranch main
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --all --locked
        env:
          INSTA_UPDATE: "no"

  # Extension unit, script and integration tests (spec 12.5) against the
  # debug server that `pnpm test` builds. VS Code is pinned to the
  # `engines.vscode` floor on every OS, so the suite is deterministic, its
  # download is cached, and the manifest's minimum version is proven; one
  # `stable` job catches upstream changes before users meet them.
  extension:
    name: extension (${{ matrix.os }}, VS Code ${{ matrix.vscode }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        vscode: ["1.91.0"]
        include:
          - os: ubuntu-latest
            vscode: stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CLIPPINGS_TEST_VSCODE: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: extension/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.3
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - name: Cache the VS Code download
        if: matrix.vscode != 'stable'
        uses: actions/cache@v4
        with:
          path: extension/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ runner.arch }}-${{ matrix.vscode }}
      - run: pnpm -C extension install --frozen-lockfile
      - name: pnpm -C extension test
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm -C extension test
      - name: pnpm -C extension test
        if: runner.os != 'Linux'
        run: pnpm -C extension test

  # TEMPORARY flake hunt: repeats the macOS integration run. Reverted before merge.
  flake-hunt:
    name: flake hunt (macos-latest, ${{ matrix.rep }})
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CLIPPINGS_TEST_VSCODE: "1.91.0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: extension/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.3
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - uses: actions/cache@v4
        with:
          path: extension/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ runner.arch }}-1.91.0
      - run: pnpm -C extension install --frozen-lockfile
      - run: pnpm -C extension dev && pnpm -C extension build
      - run: pnpm -C extension test:integration

  # The workflows and the release scripts. shellcheck comes with the runner
  # image; actionlint also runs it on every workflow `run:` block.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
      - run: ./actionlint -color
      - run: shellcheck --version
      - run: shellcheck -P SCRIPTDIR -x scripts/dist/*.sh

  # The nine server builds and ten packages run from dist.yml on pushes to
  # main, not from here: nesting the `id-token: write` permission that
  # macOS and Windows signing need inside a workflow that also triggers on
  # `pull_request` lets GitHub's fork/Dependabot permission cap reject this
  # whole workflow at load time, even on a run where the gated job would be
  # skipped. Keeping this workflow's permissions minimal everywhere avoids
  # that.
